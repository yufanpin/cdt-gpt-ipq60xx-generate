name: Build GPT

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

jobs:
  generate-gpt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate re-cs-07 GPT
        run: |
          python3 generate_gpt.py -c meta-tools/ipq6018-re-cs-07/config.xml -o gpt_main0-re-cs-07.bin -d output

      - name: Upload GPT artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-re-cs-07
          path: output/gpt_main0-re-cs-07.bin
          if-no-files-found: error

  release:
    needs: [generate-gpt]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test' && github.event_name != 'pull_request'
    steps:
      - name: Download GPT artifact
        uses: actions/download-artifact@v4
        with:
          name: gpt-re-cs-07

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: Test Build #${{ github.run_number }}
          files: gpt_main0-re-cs-07.bin
          fail_on_unmatched_files: false
          make_latest: false
          draft: true
